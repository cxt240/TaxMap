server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  include mime.types;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types application/json application/geo+json application/javascript text/css text/plain;

  location ~ \.geojson$ {
    default_type application/geo+json;
  }

  location ~ \.mjs$ {
    default_type application/javascript;
    etag off;
    if_modified_since off;
  }

  location /api/ {
    proxy_pass http://api:3000;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
